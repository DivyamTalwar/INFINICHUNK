name: Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  provenance-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile the extension surface
        run: >-
          python -m py_compile
          verl/experimental/agent_loop/infinichunk_agent_loop.py
          verl/experimental/agent_loop/infinichunk_trimmers.py
          infinichunk_ext/prefix_cache.py
          infinichunk_ext/carryover.py
          verl/workers/reward_manager/infinichunk.py
      - name: Verify provenance invariants
        run: python -m unittest discover -s tests -v
