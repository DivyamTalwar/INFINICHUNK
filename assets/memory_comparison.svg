<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="250" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  
  <text x="450" y="40" font-family="Arial" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">GPU MEMORY FOOTPRINT (100K Tokens)</text>

  <!-- Bar 1: Standard -->
  <g transform="translate(100, 80)">
    <text x="10" y="20" font-family="Arial" font-size="14" fill="#ff4b2b" font-weight="bold">Standard</text>
    <rect x="120" y="0" width="600" height="30" rx="4" fill="#ff4b2b" opacity="0.3"/>
    <rect x="120" y="0" width="600" height="30" rx="4" fill="none" stroke="#ff4b2b" stroke-width="2"/>
    <text x="740" y="20" font-family="Arial" font-size="14" fill="#ff4b2b">100+ GB (OOM)</text>
  </g>

  <!-- Bar 2: INFINICHUNK -->
  <g transform="translate(100, 150)">
    <text x="10" y="20" font-family="Arial" font-size="14" fill="#00c6ff" font-weight="bold">INFINICHUNK</text>
    <rect x="120" y="0" width="100" height="30" rx="4" fill="url(#barGrad)"/>
    <text x="240" y="20" font-family="Arial" font-size="14" fill="#00c6ff">12 GB (Constant)</text>
    
    <!-- Sparkles -->
    <circle cx="225" cy="5" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="230" cy="25" r="3" fill="#fff" opacity="0.6"/>
  </g>

</svg>