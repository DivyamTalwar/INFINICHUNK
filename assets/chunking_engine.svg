<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <!-- Detailed Gradients -->
    <linearGradient id="bgDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="streamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c6ff;stop-opacity:0" />
    </linearGradient>

    <!-- Use clear tech colors -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle pulsing grid -->
  <rect width="900" height="450" rx="12" fill="url(#bgDeep)" stroke="#333" stroke-width="1"/>
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="900" height="450" fill="url(#grid)"/>

  <!-- Title Area -->
  <text x="450" y="40" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="2">INFINICHUNK ENGINE</text>
  <text x="450" y="65" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">Infinite Memory • Linear Compute • recursive State</text>

  <!-- === LEFT: INPUT === -->
  <g transform="translate(100, 220)">
    <!-- Input Box -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#1a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <text x="0" y="-15" font-family="Arial" font-size="14" fill="#00c6ff" text-anchor="middle" font-weight="bold">CHUNK N</text>
    
    <!-- Input Details -->
    <text x="0" y="10" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">Prompt Tokens</text>
    <text x="0" y="25" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">+</text>
    <text x="0" y="40" font-family="Arial" font-size="11" fill="#9013fe" text-anchor="middle">Carryover State</text>
  </g>

  <!-- === CENTER: PROCESSING ENGINE === -->
  <g transform="translate(450, 220)">
    <!-- Outer Ring -->
    <circle r="110" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="8, 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner Engine Container -->
    <circle r="90" fill="#111" stroke="#50c878" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Core Logic Text -->
    <text x="0" y="-40" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">LLM INFERENCE</text>
    
    <!-- Dividing Line -->
    <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#555" stroke-width="1"/>
    
    <!-- State Operations -->
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#00c6ff" text-anchor="middle">1. Generate (C)</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#f5a623" text-anchor="middle">2. Trim Middle</text>
    <text x="0" y="40" font-family="Arial" font-size="12" fill="#9013fe" text-anchor="middle">3. Extract State</text>
    
    <!-- Pulsing Core Glow -->
    <circle r="95" fill="none" stroke="#50c878" stroke-width="2" stroke-opacity="0.3">
      <animate attributeName="r" values="95;100;95" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- === RIGHT: OUTPUT === -->
  <g transform="translate(800, 220)">
    <!-- Output Box -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#1a1a2e" stroke="#50c878" stroke-width="2"/>
    <text x="0" y="-15" font-family="Arial" font-size="14" fill="#50c878" text-anchor="middle" font-weight="bold">NEXT STEP</text>
    
    <!-- Output Details -->
    <text x="0" y="10" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">New Tokens</text>
    <text x="0" y="25" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">→</text>
    <text x="0" y="40" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">Append to Final</text>
  </g>


  <!-- === FLOW ARROWS === -->
  
  <!-- Flow 1: Input to Engine -->
  <path d="M160,220 L340,220" stroke="#333" stroke-width="4"/>
  <path d="M160,220 L340,220" stroke="url(#streamGradient)" stroke-width="2" stroke-dasharray="20, 20">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="250" y="200" font-family="Arial" font-size="10" fill="#00c6ff" text-anchor="middle">Context Window (C)</text>

  <!-- Flow 2: Engine to Output -->
  <path d="M560,220 L740,220" stroke="#333" stroke-width="4"/>
  <path d="M560,220 L740,220" stroke="#50c878" stroke-width="2" stroke-dasharray="20, 20">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="650" y="200" font-family="Arial" font-size="10" fill="#50c878" text-anchor="middle">Completed Steps</text>

  <!-- Flow 3: RECURSIVE LOOP (The critical part) -->
  <path d="M450,110 C450,80 300,80 100,180" fill="none" stroke="#9013fe" stroke-width="2" stroke-dasharray="5, 5" marker-end="url(#arrowPurple)">
     <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <!-- Highlight loop connection from Engine Top -->
  <line x1="450" y1="130" x2="450" y2="110" stroke="#9013fe" stroke-width="2"/>
  
  <rect x="230" y="90" width="100" height="20" rx="4" fill="#050510" stroke="#9013fe" stroke-width="1"/>
  <text x="280" y="104" font-family="Arial" font-size="10" fill="#9013fe" text-anchor="middle">Carryover Loop (m)</text>


  <!-- === FOOTER LEGEND === -->
  <g transform="translate(150, 400)">
    <circle r="4" fill="#00c6ff"/>
    <text x="10" y="4" font-family="Arial" font-size="11" fill="#bbb">Blue: Input Context</text>
  </g>
  <g transform="translate(450, 400)">
    <circle r="4" fill="#f5a623"/>
    <text x="10" y="4" font-family="Arial" font-size="11" fill="#bbb">Orange: Trimming Logic</text>
  </g>
  <g transform="translate(750, 400)">
    <circle r="4" fill="#9013fe"/>
    <text x="10" y="4" font-family="Arial" font-size="11" fill="#bbb">Purple: Recursive State</text>
  </g>

  <!-- Markers -->
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9013fe" />
  </marker>

</svg>