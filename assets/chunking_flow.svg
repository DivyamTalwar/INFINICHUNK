<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <!-- Ultra Smooth Gradients -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="popGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Clipping Path -->
    <clipPath id="genBoxClip">
       <rect width="250" height="320" rx="12" />
    </clipPath>
    
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="softShadow">
       <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
       <feOffset dx="0" dy="4" result="offsetblur"/>
       <feComponentTransfer>
         <feFuncA type="linear" slope="0.2"/>
       </feComponentTransfer>
       <feMerge>
         <feMergeNode in="offsetblur"/>
         <feMergeNode in="SourceGraphic"/>
       </feMerge>
    </filter>
  </defs>

  <!-- Background (Height 600) -->
  <rect width="1000" height="600" rx="16" fill="#0c0c16" stroke="#222" stroke-width="1"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="50" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#fff" text-anchor="middle" font-weight="300" letter-spacing="4">INFINICHUNK FLOW</text>
  <text x="500" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="middle" letter-spacing="1">CONTINUOUS REASONING ENGINE</text>


  <!-- === STAGE 1: ACCUMULATION (Left) === -->
  <g transform="translate(100, 140)">
    <!-- Container -->
    <rect width="250" height="320" rx="12" fill="#141420" stroke="#333" stroke-width="1" filter="url(#softShadow)"/>
    
    <text x="125" y="40" font-family="Arial" font-size="13" fill="#4facfe" text-anchor="middle" font-weight="bold">GENERATION</text>
    
    <!-- Clip content to stay inside -->
    <g clip-path="url(#genBoxClip)">
        <g transform="translate(25, 70)">
            <!-- Head -->
            <rect width="200" height="30" rx="4" fill="url(#headGrad)"/>
            <text x="100" y="20" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Fixed Head</text>
            
            <!-- Growing Body -->
            <rect y="40" width="200" height="100" rx="4" fill="#222" stroke="#444" stroke-dasharray="4,4"/>
            <text x="100" y="90" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Existing Context</text>
            
            <!-- SUPER SMOOTH GROWTH (Reduced Max Height to stay safely inside) -->
            <rect x="0" y="150" width="200" height="0" rx="4" fill="url(#popGrad)" opacity="0.9">
                <!-- Max height changed from 120 to 90 to prevent overflow -->
                <animate attributeName="height" values="0; 90; 90; 0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1" keyTimes="0; 0.5; 0.8; 1"/>
            </rect>
            
            <text x="100" y="260" font-family="Arial" font-size="11" fill="#38f9d7" text-anchor="middle" opacity="0">
                Generating...
                <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.2; 0.5; 1"/>
            </text>
        </g>
    </g>
  </g>


  <!-- Animated Connection Line -->
  <path d="M350,280 L420,280" stroke="#444" stroke-width="2"/>
  <circle cx="350" cy="280" r="3" fill="#fff">
      <animate attributeName="cx" from="350" to="420" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>


  <!-- === STAGE 2: COMPRESSION (Center) === -->
  <g transform="translate(420, 140)">
    
    <text x="90" y="40" font-family="Arial" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="bold">TRIMMING</text>
    
    <!-- TRIMMING VISUALIZATION -->
    <g transform="translate(0, 70)">
        <!-- Top (Head) -->
        <rect width="180" height="30" rx="4" fill="#4facfe"/>
        
        <!-- Middle (The Victim) -->
        <rect y="35" width="180" height="190" rx="4" fill="#ff6b6b" opacity="0">
            <!-- Appears softly -->
            <animate attributeName="opacity" values="0; 0; 0.6; 0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.5; 0.6; 1"/>
            <animate attributeName="height" values="190; 190; 0; 190" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="1 0 0 1; 0.4 0 0.2 1; 1 0 0 1" keyTimes="0; 0.6; 0.7; 1"/>
        </rect>
        
        <!-- TEXT LABEL FOR DELETE -->
        <text x="90" y="130" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" opacity="0">
            DISCARD MIDDLE
            <animate attributeName="opacity" values="0; 0; 1; 0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.55; 0.65; 1"/>
        </text>

        <!-- Bottom (Tail - moves up effortlessly) -->
        <rect y="235" width="180" height="60" rx="4" fill="#a18cd1">
             <animate attributeName="y" values="235; 235; 40; 235" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="1 0 0 1; 0.4 0 0.2 1; 1 0 0 1" keyTimes="0; 0.6; 0.7; 1"/>
        </rect>
    </g>
  </g>


  <!-- Animated Connection Line -->
  <path d="M600,280 L680,280" stroke="#444" stroke-width="2"/>
  <circle cx="600" cy="280" r="3" fill="#fff">
      <animate attributeName="cx" from="600" to="680" dur="2s" repeatCount="indefinite" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>


  <!-- === STAGE 3: RESULT (Right) === -->
  <g transform="translate(680, 140)">
     <rect width="220" height="320" rx="12" fill="#141420" stroke="#333" stroke-width="1" filter="url(#softShadow)"/>
     <text x="110" y="40" font-family="Arial" font-size="13" fill="#a18cd1" text-anchor="middle" font-weight="bold">NEXT STATE</text>

     <g transform="translate(10, 100)">
        <rect width="200" height="90" rx="4" fill="none" stroke="#666" stroke-dasharray="4,4" opacity="0.3"/>
        
        <text x="100" y="50" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" opacity="0.3">Waiting...</text>
        <text x="100" y="50" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" opacity="0">
             READY
             <animate attributeName="opacity" values="0; 0; 1; 0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.7; 0.8; 1"/>
        </text>

        <!-- Soft Glow Pulse -->
        <rect x="0" y="0" width="200" height="90" rx="4" fill="#a18cd1" opacity="0">
             <animate attributeName="opacity" values="0; 0; 0.3; 0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.75; 0.9; 1"/>
        </rect>
     </g>
  </g>

  <!-- Legend (MOVED DOWN to avoid overlap) -->
  <g transform="translate(100, 520)">
    <text font-family="Arial" font-size="11" fill="#666" text-anchor="middle">
       <tspan x="400">The infinite loop of generation and compression keeps memory usage constant O(1).</tspan>
    </text>
  </g>

</svg>