<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trimGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#0d0d15" rx="10"/>

  <!-- Chunk 1 -->
  <g transform="translate(30, 100)">
    <rect width="180" height="120" rx="8" fill="url(#chunkGradient)" stroke="#4a90e2" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#4a90e2" text-anchor="middle" font-weight="bold">Chunk 1: Initial</text>
    
    <!-- Content Representation -->
    <rect x="20" y="30" width="140" height="20" rx="3" fill="#555"/>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Prompt</text>
    
    <rect x="20" y="60" width="140" height="40" rx="3" fill="#4a90e2" opacity="0.3"/>
    <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Response (C tokens)</text>
  </g>

  <!-- Arrows 1 -->
  <path d="M210,160 L250,160" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trim Process -->
  <g transform="translate(250, 80)">
    <rect width="100" height="160" rx="8" fill="url(#trimGradient)" stroke="#f5a623" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#f5a623" text-anchor="middle" font-weight="bold">Trim</text>
    
    <rect x="20" y="30" width="60" height="20" rx="3" fill="#50c878"/>
    <text x="50" y="44" font-family="Arial, sans-serif" font-size="9" fill="#000" text-anchor="middle">Head</text>
    
    <rect x="20" y="60" width="60" height="40" rx="3" fill="#555" opacity="0.3" stroke="#555" stroke-dasharray="3,3"/>
    <text x="50" y="85" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">Discarded</text>
    
    <rect x="20" y="110" width="60" height="30" rx="3" fill="#9013fe"/>
    <text x="50" y="129" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">Tail (m)</text>
  </g>

  <!-- Arrows 2 -->
  <path d="M350,160 L390,160" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Chunk 2 -->
  <g transform="translate(390, 100)">
    <rect width="180" height="120" rx="8" fill="url(#chunkGradient)" stroke="#9013fe" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#9013fe" text-anchor="middle" font-weight="bold">Chunk 2: Continue</text>
    
    <g transform="translate(20, 30)">
        <rect width="30" height="20" rx="3" fill="#50c878"/> <!-- Head -->
        <rect x="35" y="0" width="105" height="20" rx="3" fill="#9013fe"/> <!-- Tail -->
        <text x="70" y="14" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">Carryover State</text>
    </g>
    
    <rect x="20" y="60" width="140" height="40" rx="3" fill="#9013fe" opacity="0.3"/>
    <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">New Resp (C-m)</text>
  </g>
  
  <!-- Arrows 3 -->
  <path d="M570,160 L610,160" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final -->
  <g transform="translate(610, 110)">
    <rect width="160" height="100" rx="8" fill="url(#chunkGradient)" stroke="#50c878" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#50c878" text-anchor="middle" font-weight="bold">Chunk N</text>
    <rect x="20" y="30" width="120" height="50" rx="3" fill="#50c878" opacity="0.2"/>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Final Answer</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff" />
    </marker>
  </defs>

</svg>