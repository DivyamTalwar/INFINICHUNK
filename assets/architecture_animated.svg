<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b32b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1488cc;stop-opacity:1" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" rx="15" fill="#050505" stroke="#333" stroke-width="1"/>
  
  <text x="450" y="40" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="2">SYSTEM ARCHITECTURE</text>

  <!-- Component: Dataset -->
  <g transform="translate(50, 200)">
    <rect width="120" height="80" rx="8" fill="#1a1a2e" stroke="#1488cc" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="14" fill="#1488cc" text-anchor="middle" font-weight="bold">DATASET</text>
  </g>

  <!-- Component: Rollout Worker (Animated) -->
  <g transform="translate(250, 150)">
    <rect width="180" height="180" rx="12" fill="#111" stroke="#9013fe" stroke-width="2"/>
    <text x="90" y="30" font-family="Arial" font-size="14" fill="#9013fe" text-anchor="middle" font-weight="bold">ROLLOUT WORKER</text>
    
    <!-- Inner Animation -->
    <rect x="40" y="60" width="100" height="20" rx="4" fill="#333"/>
    <rect x="40" y="90" width="100" height="20" rx="4" fill="#333"/>
    <rect x="40" y="120" width="100" height="20" rx="4" fill="#333"/>
    
    <!-- Moving Head -->
    <rect x="35" y="55" width="110" height="30" rx="5" fill="none" stroke="#9013fe" stroke-width="2" opacity="0">
      <animate attributeName="y" values="55;85;115;55" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Component: Trainer -->
  <g transform="translate(550, 150)">
    <rect width="180" height="180" rx="12" fill="#111" stroke="#50c878" stroke-width="2"/>
    <text x="90" y="30" font-family="Arial" font-size="14" fill="#50c878" text-anchor="middle" font-weight="bold">PPO TRAINER</text>
    
    <!-- Graph Animation -->
    <polyline points="20,140 50,120 80,130 110,90 140,80 160,50" fill="none" stroke="#50c878" stroke-width="3">
       <animate attributeName="stroke-dasharray" from="0,200" to="200,0" dur="2s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Component: Ray -->
  <g transform="translate(250, 400)">
    <rect width="480" height="60" rx="8" fill="#222"/>
    <text x="240" y="35" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle" letter-spacing="4">RAY DISTRIBUTED FABRIC</text>
  </g>

  <!-- Connections -->
  <!-- Data -> Rollout -->
  <path d="M170,240 L250,240" stroke="#fff" stroke-width="2" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Rollout <-> Trainer -->
  <path d="M430,220 L550,220" stroke="#fff" stroke-width="4"/>
  <circle cx="430" cy="220" r="5" fill="#fff">
     <animate attributeName="cx" from="430" to="550" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <path d="M550,260 L430,260" stroke="#fff" stroke-width="4"/>
  <circle cx="550" cy="260" r="5" fill="#50c878">
     <animate attributeName="cx" from="550" to="430" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <text x="490" y="200" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">Data</text>
  <text x="490" y="290" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">Gradients</text>

</svg>