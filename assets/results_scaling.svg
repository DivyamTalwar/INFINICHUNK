<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff416c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4b2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="600" rx="20" fill="#0f0f1a" stroke="#333" stroke-width="1"/>
  <rect width="1000" height="600" fill="url(#grid)" opacity="0.3"/>
  <text x="50" y="50" font-family="Arial" font-size="28" fill="#fff" font-weight="bold">MEMORY SCALABILITY: Tearing Down the Wall</text>
  <text x="50" y="80" font-family="Arial" font-size="14" fill="#aaa">Why Standard Transformers Fail at Long Contexts</text>

  <!-- === COMPARISON BLOCKS === -->
  
  <!-- LEFT: STANDARD (BAD) -->
  <g transform="translate(50, 120)">
     <rect width="420" height="350" rx="10" fill="#1a1a2e" stroke="#333"/>
     <rect width="420" height="50" rx="10" fill="#331111" stroke="#ff4b2b"/>
     <text x="210" y="32" font-family="Arial" font-size="18" fill="#ff4b2b" text-anchor="middle" font-weight="bold">STANDARD TRANSFORMER</text>
     
     <g transform="translate(30, 80)">
         <text y="20" font-family="Arial" font-size="14" fill="#fff">Complexity: <tspan fill="#ff4b2b" font-weight="bold">O(N²) Quadratic</tspan></text>
         <text y="50" font-family="Arial" font-size="12" fill="#888">Memory grows exponentially with length.</text>
         
         <!-- Visual Curve -->
         <path d="M0,200 Q100,200 360,20" fill="none" stroke="url(#dangerGrad)" stroke-width="5"/>
         <circle cx="360" cy="20" r="8" fill="#ff4b2b"/>
         <text x="280" y="40" font-family="Arial" font-size="14" fill="#ff4b2b" font-weight="bold">OOM CRASH</text>
         <text x="280" y="60" font-family="Arial" font-size="11" fill="#bbb">@ 32k tokens</text>
     </g>
  </g>

  <!-- RIGHT: INFINICHUNK (GOOD) -->
  <g transform="translate(530, 120)">
     <rect width="420" height="350" rx="10" fill="#1a1a2e" stroke="#333"/>
     <rect width="420" height="50" rx="10" fill="#113322" stroke="#38ef7d"/>
     <text x="210" y="32" font-family="Arial" font-size="18" fill="#38ef7d" text-anchor="middle" font-weight="bold">INFINICHUNK (OURS)</text>
     
     <g transform="translate(30, 80)">
         <text y="20" font-family="Arial" font-size="14" fill="#fff">Complexity: <tspan fill="#38ef7d" font-weight="bold">O(1) Constant</tspan></text>
         <text y="50" font-family="Arial" font-size="12" fill="#888">Memory stays flat forever.</text>
         
         <!-- Visual Curve -->
         <path d="M0,180 L360,180" fill="none" stroke="url(#safeGrad)" stroke-width="5"/>
         <circle cx="360" cy="180" r="8" fill="#38ef7d"/>
         <text x="280" y="160" font-family="Arial" font-size="14" fill="#38ef7d" font-weight="bold">STABLE</text>
         <text x="270" y="210" font-family="Arial" font-size="11" fill="#bbb">Even at 100k+ tokens</text>
         
         <!-- Highlight Box -->
         <rect x="0" y="210" width="360" height="40" rx="5" fill="#38ef7d" fill-opacity="0.1" stroke="#38ef7d" stroke-dasharray="2,2"/>
         <text x="180" y="235" font-family="Arial" font-size="11" fill="#38ef7d" text-anchor="middle">Fits on a single A100 GPU (80GB)</text>
     </g>
  </g>
  
  <!-- Footer -->
  <g transform="translate(50, 500)">
     <rect width="900" height="60" rx="8" fill="#222"/>
     <text x="450" y="25" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">TECHNICAL IMPLICATION</text>
     <text x="450" y="45" font-family="Arial" font-size="11" fill="#aaa" text-anchor="middle">
         This allows us to train "Reasoning Models" (System 2 Thinking) that can think for hours without running out of VRAM.
     </text>
  </g>

</svg>