<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff416c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4b2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="350" rx="15" fill="#0f0c29" stroke="#333" stroke-width="1"/>
  
  <text x="450" y="40" font-family="Arial" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">COMPUTE SCALING: THE QUADRATIC WALL</text>

  <!-- Traditional Model -->
  <g transform="translate(150, 80)">
    <text x="100" y="0" font-family="Arial" font-size="16" fill="#ff4b2b" text-anchor="middle" font-weight="bold">Standard Attention</text>
    <path d="M0,200 Q100,200 200,20" fill="none" stroke="url(#badGrad)" stroke-width="4"/>
    <text x="210" y="20" font-family="Arial" font-size="14" fill="#ff4b2b" font-weight="bold">O(N²)</text>
    <text x="100" y="230" font-family="Arial" font-size="12" fill="#aaa" text-anchor="middle">Sequence Length</text>
    
    <!-- Grid illusion -->
    <rect x="-20" y="20" width="240" height="180" fill="none" stroke="#333" stroke-dasharray="4,4"/>
  </g>

  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- INFINICHUNK -->
  <g transform="translate(550, 80)">
    <text x="100" y="0" font-family="Arial" font-size="16" fill="#38ef7d" text-anchor="middle" font-weight="bold">INFINICHUNK</text>
    <path d="M0,200 L200,100" fill="none" stroke="url(#goodGrad)" stroke-width="4"/>
    <text x="210" y="100" font-family="Arial" font-size="14" fill="#38ef7d" font-weight="bold">O(N)</text>
    <text x="100" y="230" font-family="Arial" font-size="12" fill="#aaa" text-anchor="middle">Sequence Length</text>
    
    <!-- Grid illusion -->
    <rect x="-20" y="20" width="240" height="180" fill="none" stroke="#333" stroke-dasharray="4,4"/>
  </g>

</svg>